name: macOS Universal Release Pipeline
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-universal-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Frontend UI
        run: cd ui && npm ci && npm run build
      - name: Compile Universal Binary
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin -p gitupload-app
          cargo build --release --target x86_64-apple-darwin -p gitupload-app
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/gitupload-app \
            target/x86_64-apple-darwin/release/gitupload-app \
            -output target/universal-apple-darwin/release/gitupload-app
          file target/universal-apple-darwin/release/gitupload-app
