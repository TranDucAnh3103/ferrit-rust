[package]
name = "gitupload-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri v2 Desktop Binary and IPC Command Layer for FERRIT"

[lib]
name = "gitupload_app"
path = "src/lib.rs"

[[bin]]
name = "ferrit"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
gitupload-core.workspace = true
gitupload-security.workspace = true
gitupload-storage.workspace = true
gitupload-git.workspace = true
gitupload-hooks.workspace = true
gitupload-ghcli.workspace = true
gitupload-github.workspace = true
gitupload-ai.workspace = true
gitupload-watcher.workspace = true
gitupload-plugins.workspace = true
rand.workspace = true

tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-shell.workspace = true
tauri-plugin-fs.workspace = true
tauri-plugin-single-instance.workspace = true

tokio.workspace = true
tokio-util.workspace = true
secrecy.workspace = true
chrono.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
windows-sys.workspace = true
mimalloc.workspace = true
opener.workspace = true
directories.workspace = true
pulldown-cmark.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest.workspace = true
thiserror.workspace = true
ring.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
rand.workspace = true
wat.workspace = true
git2.workspace = true
