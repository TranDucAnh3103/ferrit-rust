[workspace]
resolver = "2"
members = [
    "crates/gitupload-core",
    "crates/gitupload-security",
    "crates/gitupload-storage",
    "crates/gitupload-git",
    "crates/gitupload-hooks",
    "crates/gitupload-ghcli",
    "crates/gitupload-github",
    "crates/gitupload-ai",
    "crates/gitupload-watcher",
    "crates/gitupload-plugins",
    "crates/gitupload-cli",
    "crates/gitupload-app",
]

[workspace.package]
version = "2.2.0"
authors = ["Stephen <tranducanh31032006@gmail.com>", "DeepMind Swarm Engineers"]
edition = "2021"
rust-version = "1.82.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/java-web-service-stephenduc/rust-gitupload"

[workspace.dependencies]
# Tauri v2 Desktop Framework
tauri = { version = "2.1", default-features = false, features = ["wry", "tray-icon", "image-png", "compression", "common-controls-v6", "dynamic-acl"] }
tauri-build = { version = "2.0" }
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-single-instance = "2.0"

# Async Runtime & Concurrency Dispatch
tokio = { version = "1.41", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# Native Git Engine & libgit2 C-bindings
git2 = { version = "0.19", default-features = false, features = ["https"] }

# OS Credential Store & In-Memory Secret Zeroization
keyring = { version = "3.0", features = ["windows-native"] }
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# SQLite Embedded Database & Connection Pooling
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Networking & Cloud AI SSE Streaming
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
eventsource-stream = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

# Archive Compression & Hashing (for GitHub CLI Sandbox & Checksums)
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"

# Filesystem Watching & Git Hooks
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }
notify-debouncer-mini = "0.4"

# String Manipulation, Markdown, Regex & Formatting
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
pulldown-cmark = "0.12"
toml = "0.8"

# Error Handling & Tracing Observability
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "chrono"] }
tracing-appender = "0.2"

# Windows Native Platform Bindings
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_Security"
] }

# High-Performance Memory Allocator & Desktop Utilities
mimalloc = { version = "0.1", default-features = false }
opener = "0.7"
directories = "5.0"

# Testing & Benchmarking Utilities
tempfile = "3.14"
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports"] }

# WebAssembly & Plugin Sandbox
wasmtime = "26.0"
wat = "1.263"
flate2 = "1.0"
tar = "0.4"
ring = "0.17"

# CLI & Terminal Utilities
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
colored = "2.1"
indicatif = "0.17"

# Internal Workspace Crates
gitupload-core = { path = "crates/gitupload-core" }
gitupload-security = { path = "crates/gitupload-security" }
gitupload-storage = { path = "crates/gitupload-storage" }
gitupload-git = { path = "crates/gitupload-git" }
gitupload-hooks = { path = "crates/gitupload-hooks" }
gitupload-ghcli = { path = "crates/gitupload-ghcli" }
gitupload-github = { path = "crates/gitupload-github" }
gitupload-ai = { path = "crates/gitupload-ai" }
gitupload-watcher = { path = "crates/gitupload-watcher" }
gitupload-plugins = { path = "crates/gitupload-plugins" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
